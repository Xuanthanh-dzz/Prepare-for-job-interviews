name: Interview prep website

on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Deploy the current gh-pages snapshot from main
        required: false
        default: "false"

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: interview-prep-pages
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout main UI source
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-source
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install docs dependencies from main
        run: pip install -r production-source/requirements-docs.txt

      - name: Compose preview with main UI
        shell: bash
        run: |
          set -euo pipefail
          COMPOSER="production-source/scripts/compose_preview.py"
          if [ ! -f "$COMPOSER" ]; then COMPOSER="source/scripts/compose_preview.py"; fi
          python "$COMPOSER" --main production-source --branch source --output composed-preview

      - name: Validate composed question bank
        shell: bash
        run: |
          set -euo pipefail
          cd composed-preview
          python ../production-source/scripts/validate_questions.py

      - name: Validate composed MkDocs build
        run: mkdocs build --strict -f composed-preview/mkdocs.yml -d "$GITHUB_WORKSPACE/build-validation"

  publish-snapshot:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout main UI source
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-source
          fetch-depth: 0

      - name: Checkout Pages storage branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publish

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install docs dependencies from main
        run: pip install -r production-source/requirements-docs.txt

      - name: Build production from main
        run: mkdocs build --strict -f production-source/mkdocs.yml -d "$GITHUB_WORKSPACE/build-production"

      - name: Backup existing previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/preview-backup"
          if [ -d publish/previews ]; then cp -a publish/previews "$GITHUB_WORKSPACE/preview-backup/"; fi

      - name: Prepare production root
        shell: bash
        run: |
          set -euo pipefail
          find publish -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/build-production/." publish/
          mkdir -p publish/previews

      - name: Rebuild every branch preview from main UI
        if: github.ref_name == 'main'
        shell: bash
        run: |
          set -euo pipefail
          git -C production-source fetch origin '+refs/heads/*:refs/remotes/origin/*'
          COMPOSER="production-source/scripts/compose_preview.py"
          if [ ! -f "$COMPOSER" ]; then COMPOSER="source/scripts/compose_preview.py"; fi
          while IFS= read -r BRANCH; do
            if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "gh-pages" ]; then continue; fi
            BRANCH_SLUG="$(printf '%s' "$BRANCH" | sed 's#[/ ]#-#g' | tr -cd 'A-Za-z0-9._-')"
            echo "Rebuilding preview for $BRANCH -> $BRANCH_SLUG"
            rm -rf branch-source preview-source preview-build
            mkdir -p branch-source
            git -C production-source archive "origin/$BRANCH" | tar -x -C branch-source
            if python "$COMPOSER" --main production-source --branch branch-source --output preview-source && mkdocs build --strict -f preview-source/mkdocs.yml -d "$GITHUB_WORKSPACE/preview-build"; then
              rm -rf "publish/previews/$BRANCH_SLUG"
              mkdir -p "publish/previews/$BRANCH_SLUG"
              cp -a "$GITHUB_WORKSPACE/preview-build/." "publish/previews/$BRANCH_SLUG/"
            else
              echo "::warning::Could not rebuild $BRANCH. Keeping its previous preview if available."
              if [ -d "$GITHUB_WORKSPACE/preview-backup/previews/$BRANCH_SLUG" ]; then
                rm -rf "publish/previews/$BRANCH_SLUG"
                cp -a "$GITHUB_WORKSPACE/preview-backup/previews/$BRANCH_SLUG" "publish/previews/$BRANCH_SLUG"
              fi
            fi
          done < <(git -C production-source ls-remote --heads origin | awk '{ref=$2; sub("refs/heads/", "", ref); print ref}')

      - name: Build current branch preview from main UI
        id: branch-preview
        if: github.ref_name != 'main'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$GITHUB_WORKSPACE/preview-backup/previews" ]; then cp -a "$GITHUB_WORKSPACE/preview-backup/previews/." publish/previews/; fi
          BRANCH_SLUG="$(printf '%s' "$GITHUB_REF_NAME" | sed 's#[/ ]#-#g' | tr -cd 'A-Za-z0-9._-')"
          COMPOSER="production-source/scripts/compose_preview.py"
          if [ ! -f "$COMPOSER" ]; then COMPOSER="source/scripts/compose_preview.py"; fi
          python "$COMPOSER" --main production-source --branch source --output preview-source
          mkdocs build --strict -f preview-source/mkdocs.yml -d "$GITHUB_WORKSPACE/preview-build"
          rm -rf "publish/previews/$BRANCH_SLUG"
          mkdir -p "publish/previews/$BRANCH_SLUG"
          cp -a "$GITHUB_WORKSPACE/preview-build/." "publish/previews/$BRANCH_SLUG/"
          echo "branch_slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"

      - name: Save generated site snapshot
        shell: bash
        working-directory: publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated site changes to commit."
          else
            git commit -m "deploy snapshot: $GITHUB_REF_NAME"
            git push origin HEAD:gh-pages
          fi

      - name: Request branch preview deployment through main
        if: github.ref_name != 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/docs.yml/dispatches" -d '{"ref":"main","inputs":{"deploy_only":"true"}}'

      - name: Publish branch preview URL
        if: github.ref_name != 'main'
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "### Branch preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "UI source: main" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://${OWNER}.github.io/${REPO}/previews/${{ steps.branch-preview.outputs.branch_slug }}/" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: publish-snapshot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Pages snapshot
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publish

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages-artifact
          rsync -a --delete --exclude='.git' publish/ pages-artifact/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Publish production URL
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "https://${OWNER}.github.io/${REPO}/" >> "$GITHUB_STEP_SUMMARY"

  deploy-preview-snapshot:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && github.event.inputs.deploy_only == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Pages snapshot
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publish

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages-artifact
          rsync -a --delete --exclude='.git' publish/ pages-artifact/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
